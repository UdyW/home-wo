<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F6B66">
  <title>Home gym log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Home gym log</h1>
    <nav class="views" aria-label="Sections">
      <button data-view="today" aria-current="page">Workout</button>
      <button data-view="history">History</button>
      <button data-view="edit">Edit plan</button>
    </nav>
  </header>
  <div id="daybar" class="daybar" role="tablist" aria-label="Workout day"></div>
  <main id="app"></main>

  <div id="timer" class="timer" hidden>
    <div class="timer-bar"><span id="tfill"></span></div>
    <div class="timer-row">
      <p><span id="tlabel">Rest</span> <strong id="tleft">0:00</strong></p>
      <button data-t="add">+15 s</button>
      <button data-t="skip">Skip</button>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
